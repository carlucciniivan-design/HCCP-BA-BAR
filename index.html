body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:linear-gradient(rgba(244,245,243,.62), rgba(244,245,243,.62)), var(--bgphoto) center / cover no-repeat;}
:root[data-theme="dark"] body::before{background:linear-gradient(rgba(20,24,21,.72), rgba(20,24,21,.72)), var(--bgphoto) center / cover no-repeat;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::before{background:linear-gradient(rgba(20,24,21,.72), rgba(20,24,21,.72)), var(--bgphoto) center / cover no-repeat;} }
@media print{ body::before{display:none;} }
body.nobg::before{display:none !important;}
body.nobg{background:#14110e !important;}
html:has(body.nobg){zoom:1 !important;}
body.nobg #loginScreen, body.nobg #loadingScreen{width:100vw; height:100vh; border-radius:0 !important; margin:0 !important; max-width:none !important;}
body.nobg #loginScreen, body.nobg #loadingScreen{position:fixed !important; top:0; right:0; bottom:0; left:0; min-height:0 !important; overflow-y:auto; z-index:8;}
body.nobg .card, body.nobg .tile{background:var(--card);}
.wrap{position:relative; z-index:1;}
.card{background:color-mix(in srgb, var(--card) 90%, transparent);}
.tile{background:color-mix(in srgb, var(--card) 90%, transparent);}
.row{display:flex; gap:8px;}
@media screen and (min-width:900px) and (pointer:fine){
  html{zoom:1.25;}
  .wrap{max-width:820px;}
}
.row > *{flex:1;}
.item{border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:var(--bg);}
.item .top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.item .name{font-weight:700; font-size:14px;}
.item .meta{font-size:12px; color:var(--sub); margin-top:2px;}
.pill{font-size:11px; padding:2px 7px; border-radius:20px; background:var(--accent); color:var(--accent-ink);}
.pill.warn{background:var(--warn);}
.pill.danger{background:var(--danger); color:#fff;}
nav{display:none !important; position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); z-index:5;}
nav button{flex:1; background:none; border-radius:0; padding:10px 4px; font-size:11px; color:var(--sub); font-weight:600;}
nav button.active{color:var(--accent);}
#scanOverlay{position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; background:#000; display:none; z-index:20; flex-direction:column;}
#scanOverlay video{flex:1; min-height:0; width:100%; object-fit:cover;}
#scanOverlay .bar{padding:12px calc(12px + env(safe-area-inset-top,0px)) 12px; display:flex; justify-content:space-between; color:#fff; background:#000;}
.suggest{display:none; position:absolute; left:0; right:0; top:100%; margin-top:2px; z-index:15; max-height:min(260px,40vh); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 18px #0003;}
.suggest div{padding:10px 12px; font-size:14px; border-bottom:1px solid var(--line);}
.suggest div:last-child{border-bottom:none;}
.suggest small{color:var(--sub); font-size:11px; margin-left:6px;}
.empty{color:var(--sub); font-size:13px; text-align:center; padding:14px 0;}
.check{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px;}
#labelPreview{background:#fff; color:#000; border-radius:10px; padding:10px; text-align:center;}
#labelPreview .p{font-weight:700; font-size:16px;}
#labelPreview .s{font-size:12px; color:#555; margin-top:2px;}
.lbl-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px; text-align:left; font-size:11px; margin-top:6px;}
.lbl-grid b{display:block; font-size:10px; color:#777; text-transform:uppercase;}
#qrBox{display:flex; justify-content:center; margin-top:6px;}
#qrBox canvas,#qrBox img{width:18mm !important; height:18mm !important;}
.ai-note{font-size:12px; color:var(--sub); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px; display:none;}
@media print{
  #labelPreview{ padding:2mm; border-radius:0; }
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; top:0; left:0; width:100%; }
  #printSheetArea, #printSheetArea *{ visibility:visible; }
  #printSheetArea{ position:absolute; top:0; left:0; width:100%; }
  .no-print{ display:none !important; }
}
.paper{background:#fff; color:#000; border-radius:8px; padding:14px; overflow-x:auto;}
.paper .doc-top{font-size:10px; text-align:center; color:#333;}
.paper h3{margin:6px 0 10px; text-align:center; font-size:15px;}
.paper .meta-line{font-size:12px; margin:2px 0;}
.sched-table{width:100%; border-collapse:collapse; font-size:11px; margin-top:10px; min-width:560px;}
.sched-table button{touch-action:manipulation;}
.sched-table th,.sched-table td{border:1px solid #333; padding:5px; text-align:left; vertical-align:top; color:#000;}
.sched-table th{background:#eee;}
.scheda-abb{font-family: Georgia, 'Times New Roman', Times, serif;}
.scheda-abb .doc-top2{font-size:8px; text-align:center; letter-spacing:.03em;}
.scheda-abb h3{font-family: Georgia, 'Times New Roman', Times, serif; font-weight:bold; font-size:14px; text-align:center; margin:10px 0 18px;}
.scheda-abb .field-row{margin:9px 0; font-size:10.5px;}
.scheda-abb .field-right{text-align:right;}
.scheda-abb table{width:100%; border-collapse:collapse; margin-top:16px; font-size:9.5px;}
.scheda-abb th,.scheda-abb td{border:1px solid #000; padding:5px 4px; text-align:center; vertical-align:middle; height:18px;}
.scheda-abb th{font-weight:bold; background:#fff;}
.scheda-abb td input{width:100%; border:none; background:transparent; font-family:inherit; font-size:9.5px; text-align:center; padding:2px 1px; color:#000;}
.scheda-abb td input:focus{outline:2px solid var(--accent); outline-offset:-2px; background:#fffbe6;}
.scheda-abb .field-input{border:none; border-bottom:1px solid #000; background:transparent; font-family:inherit; font-size:10.5px; color:#000; padding:1px 2px;}
.scheda-abb .field-input:focus{outline:2px solid var(--accent); outline-offset:1px; background:#fffbe6;}
.no-print{margin-top:4px;}
.print-only{display:none;}
@media print{ .print-only{display:block !important;} }
#modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:none; align-items:center; justify-content:center; padding:20px;}
#modalBox{background:var(--card); border-radius:14px; padding:16px; width:100%; max-width:360px; max-height:80vh; overflow-y:auto;}
#modalBox h3{margin:0 0 10px; font-size:15px;}
#modalBox .row{margin-top:12px;}
.hidden{display:none !important;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px;}
.tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 10px 14px; text-align:center; cursor:pointer;}
.tile .ic{width:64px; height:64px; margin:0 auto 10px; border-radius:16px; background:#dfe9e3; display:flex; align-items:center; justify-content:center; font-size:30px;}
.tile .lbl{font-size:12.5px; font-weight:600; color:var(--ink);}
.homehead{text-align:center; color:var(--sub); font-size:12px; margin:2px 0 10px;}
#loadingScreen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; background:#ffffff;}
#loadingScreen img{width:300px; height:300px; border-radius:50%; margin-bottom:18px;}
#loadingScreen .spin{width:28px; height:28px; border:3px solid rgba(0,0,0,.15); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin-top:6px;}
#loadingScreen p{color:#1d2420; font-size:13px; letter-spacing:.05em; margin-top:10px;}
@keyframes spin{ to{ transform:rotate(360deg); } }

const app = document.getElementById("app");

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
// ---------- SUGGERIMENTI HACCP (regole integrate, gratuite, funzionano sempre offline) ----------
const HACCP_RULES = {
  pesce_crudo: { label:"pesce destinato a consumo crudo", chillHours:24, shelfDays:3, frozenMonths:3, tempLabel:"-20°C al cuore per 24 ore (oppure -35°C per 15 ore)",
    note:"Pesce per consumo crudo: abbattimento di sicurezza anti-Anisakis a -20°C al cuore per almeno 24 ore (o -35°C per almeno 15 ore), secondo il Reg. CE 853/2004. Dopo lo scongelamento conserva a +4°C e consuma entro 24-48 ore." },
  pesce: { label:"pesce cotto", chillHours:1.5, shelfDays:2, frozenMonths:4, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Pesce cotto: abbattimento rapido da +90°C a +3°C al cuore entro 90 minuti (buona pratica HACCP); conservazione breve in frigorifero a +4°C." },
  carne: { label:"carne rossa", chillHours:1.5, shelfDays:4, frozenMonths:8, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Carne cotta: abbattimento rapido da +90°C a +3°C al cuore entro 90 minuti (buona pratica HACCP); poi conservazione in frigorifero a +4°C. Per surgelare: -18°C al cuore entro 4 ore." },
  pollame: { label:"pollame", chillHours:1.5, shelfDays:3, frozenMonths:6, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Pollame cotto: abbattimento rapido da +90°C a +3°C al cuore entro 90 minuti; attenzione particolare al rischio Salmonella. Conservazione in frigorifero a +4°C." },
  verdure: { label:"verdure/ortaggi", chillHours:1.5, shelfDays:4, frozenMonths:10, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Verdure cotte: abbattimento rapido a +3°C al cuore entro 90 minuti circa, poi conservazione in frigorifero a +4°C." },
  piatto_cotto: { label:"piatto cotto", chillHours:1.5, shelfDays:3, frozenMonths:3, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Piatto cotto: abbattimento rapido da +90°C a +3°C al cuore entro 90 minuti (regola HACCP generale), poi conservazione in frigorifero a +4°C." },
  generico: { label:"categoria non riconosciuta con certezza", chillHours:1.5, shelfDays:3, frozenMonths:4, tempLabel:"+3°C al cuore entro 90 minuti",
    note:"Categoria non riconosciuta con sicurezza: applicata una regola HACCP prudenziale generica (+3°C al cuore entro 90 minuti)." },
};
function categorizeProduct(name){
  const n = (name||"").toLowerCase();
  const cookedHint = ["cotto","cotta","grigliato","grigliata","al forno","fritto","fritta","in padella","arrosto","brasato","lessato"].some(k=>n.includes(k));
  const fishHint = ["pesce","salmone","tonno","branzino","orata","spigola","gamber","spada","merluzzo","trota","sgombro","acciuga","alici","polpo","calamar","seppia","cozz","vongol","crostace","sushi","sashimi"].some(k=>n.includes(k));
  if(fishHint && !cookedHint) return "pesce_crudo"; // il pesce è trattato come destinato a consumo crudo per prudenza, a meno che non sia indicato come cotto
  if(fishHint) return "pesce";
  if(["manzo","vitello","maiale","agnello","bovino","suino","carne"].some(k=>n.includes(k))) return "carne";
  if(["pollo","tacchino","pollame","anatra","gallina"].some(k=>n.includes(k))) return "pollame";
  if(["verdura","verdure","insalata","ortaggi","frutta"].some(k=>n.includes(k))) return "verdure";
  if(["sugo","ragù","brodo","piatto pronto","salsa"].some(k=>n.includes(k))) return "piatto_cotto";
  return "generico";
}
function suggestAbbEndTime(prodotto, data, oraInizio){
  const rule = HACCP_RULES[categorizeProduct(prodotto)];
  const baseDate = data || new Date().toISOString().slice(0,10);
  const start = new Date(baseDate+"T"+(oraInizio||"00:00"));
  const end = new Date(start.getTime() + rule.chillHours*3600000);
  const oraFine = String(end.getHours()).padStart(2,"0")+":"+String(end.getMinutes()).padStart(2,"0");
  const giorniSuccessivi = Math.floor((end.setHours(0,0,0,0) - new Date(baseDate+"T00:00").setHours(0,0,0,0))/86400000);
  const CONSIGLI = {
    pesce_crudo:"Pesce destinato a consumo crudo: serve l'abbattimento di sicurezza anti-Anisakis, da completare per tutto il tempo previsto. Dopo l'abbattimento conservalo in frigorifero per pochi giorni.",
    pesce:"Pesce: raffredda rapidamente fino alla temperatura di sicurezza e conserva in frigorifero per pochissimo tempo.",
    carne:"Carne: raffreddamento rapido fino alla temperatura di sicurezza, poi conservazione in frigorifero per pochi giorni.",
    pollame:"Pollame: raffreddamento rapido e attenzione particolare al rischio Salmonella; conserva in frigorifero per pochi giorni.",
    verdure:"Verdure cotte: raffreddamento rapido, poi conservazione in frigorifero per qualche giorno.",
    piatto_cotto:"Piatto cotto: raffreddamento rapido dalla cottura alla temperatura di sicurezza, poi conservazione in frigorifero per pochi giorni.",
    generico:"Categoria non riconosciuta con certezza: applicata una regola HACCP prudenziale generica."
  };
  const cat = categorizeProduct(prodotto);
  return { oraFine, giorniSuccessivi, chillHours: rule.chillHours, temperatura: rule.tempLabel, note: rule.note, consiglio: CONSIGLI[cat] + (giorniSuccessivi>0 ? " Attenzione: in questo caso l'abbattimento si conclude il giorno successivo." : "") };
}
function suggestAbbExpiry(prodotto, refDateTimeStr){
  const rule = HACCP_RULES[categorizeProduct(prodotto)];
  const ref = refDateTimeStr ? new Date(refDateTimeStr) : new Date();
  const exp = new Date(ref.getTime() + rule.shelfDays*86400000);
  return { scadenza: exp.toISOString().slice(0,10), note:`Categoria individuata: ${rule.label}. Conservazione tipica dopo l'abbattimento: ${rule.shelfDays} giorni in frigorifero.` };
}
function localDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function localDateTimeStr(d){ return localDateStr(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function suggestLabelAi(product, frozenDate, startChill){
  const rule = HACCP_RULES[categorizeProduct(product)];
  const out = { note:`Categoria individuata: ${rule.label}.`, label: rule.label, chillHours: rule.chillHours, tempLabel: rule.tempLabel, shelfDays: rule.shelfDays, frozenMonths: rule.frozenMonths, ruleNote: rule.note };
  if(frozenDate){
    const fExp = new Date(frozenDate+"T12:00"); fExp.setMonth(fExp.getMonth()+rule.frozenMonths);
    out.frozenExpiry = localDateStr(fExp);
    out.note += ` Conservazione in congelatore tipica: ${rule.frozenMonths} mesi.`;
  }
  if(startChill){
    const start = new Date(startChill);
    const end = new Date(start.getTime() + rule.chillHours*3600000);
    out.endChill = localDateTimeStr(end);
    const expAfter = new Date(end.getTime() + 2*86400000); // max 48h dopo l'abbattimento/scongelamento
    out.expiry = localDateStr(expAfter);
  }
  return out;
}
function fmtDate(d){ if(!d) return "-"; try{ return new Date(d).toLocaleDateString("it-IT"); }catch(e){ return d; } }
function daysTo(d){ if(!d) return null; const t=(new Date(d)-new Date())/86400000; return Math.ceil(t); }

}
function askForm(title, fields, onOk){
  const inputs = fields.map(f=>`<label>${esc(f.label)}</label><input id="modal_${f.id}" type="${f.type||'text'}" value="${esc(f.value||'')}">`).join("");
  showModal(`<h3>${esc(title)}</h3>${inputs}<div class="row"><button class="btn-ghost" onclick="closeModal()">Annulla</button><button class="btn-main" id="modalOkBtn">Salva</button></div>`);
  document.getElementById("modalOkBtn").onclick = ()=>{
    const values = {};
    fields.forEach(f=>{ values[f.id] = document.getElementById("modal_"+f.id).value.trim(); });
    closeModal();
    onOk(values);
  };
}

let dbErrMsg = "";
async function initDb(){
  try{
    if(typeof firebase === "undefined"){ throw new Error("Firebase SDK non caricato (connessione assente o CDN bloccato)."); }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    try{ db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); }catch(e){ console.warn(e); }
  }catch(e){ db = null; dbErrMsg = String(e && e.message || e); console.error(e); }
  if(!db){ dbErr = true; tab = pendingTab; render(); return; }
  const plain = d=>JSON.parse(JSON.stringify({id:d.id, ...d.data()}));
  const simple = d=>({id:d.id, ...d.data()});
  const load = async (name, assign, mapper)=>{
    try{ const snap = await db.collection(name).get(); assign((snap && snap.docs) ? snap.docs.map(mapper) : []); }
    catch(e){ if(!dbErrMsg) dbErrMsg = name+": "+String(e && e.message || e); }
  };
  await Promise.all([
    load("lots",        v=>LOTS=v,        simple),
    load("fatture",     v=>FATTURE=v,     simple),
    load("sheets",      v=>SHEETS=v,      simple),
    load("fridges",     v=>FRIDGES=v,     simple),
    load("temps",       v=>TEMPS=v,       simple),
    load("dishes",      v=>DISHES=v,      simple),
    load("ingredients", v=>INGREDIENTS=v, simple),
    load("sani",        v=>SANI=v,        d=>saniFromDb(plain(d))),
    load("abbattimenti",v=>ABBATTIMENTI=v,plain),
    load("attestati",   v=>ATTESTATI=v,   simple),
    (async ()=>{
      try{
        const pwDoc = await db.collection("config").doc("passwords").get();
        if(pwDoc && pwDoc.exists){ PASSWORDS = {...DEFAULT_PW, ...pwDoc.data()}; }
        else { try{ await db.collection("config").doc("passwords").set(DEFAULT_PW); }catch(e){} }
      }catch(e){ if(!dbErrMsg) dbErrMsg = "config: "+String(e && e.message || e); }
    })()
  ]);
  dbErr = false;
  tab = pendingTab;
  render();
}

async function saveLot(lot){
  const isNew = !lot.id;
  if(isNew) lot.id = uid();
  try{ await db.collection("lots").doc(lot.id).set(lot); }catch(e){ notify("Errore salvataggio: dati non persistiti."); }
  const i = LOTS.findIndex(l=>l.id===lot.id);
  if(i>=0) LOTS[i]=lot; else LOTS.unshift(lot);
  render();
}

function saniToDb(rec){
  const o = {...rec};
  o.daily = (rec.daily||[]).map(r=>r.map(v=>v?"1":"0").join(""));
  o.weekly = (rec.weekly||[]).map(r=>r.map(v=>v||"").join("|"));
  return o;
}
function saniFromDb(d){
  const o = {...d};
  if(Array.isArray(o.daily) && o.daily.length && typeof o.daily[0]==="string")
    o.daily = o.daily.map(t=>Array.from({length:31},(_,i)=>t[i]==="1"));
  if(Array.isArray(o.weekly) && o.weekly.length && typeof o.weekly[0]==="string")
    o.weekly = o.weekly.map(t=>{ const a=t.split("|"); while(a.length<5) a.push(""); return a.slice(0,5); });
  return o;
}
async function saveSani(rec){
  if(!rec.id) rec.id = (rec.location||"").replace(/[^a-zA-Z0-9_\-.~:@+]/g,"-")+"_"+rec.month;
  try{ await db.collection("sani").doc(rec.id).set(saniToDb(rec)); }catch(e){ notify("Errore salvataggio sanificazione: " + String((e && (e.code || e.message)) || e)); console.error(e); }

// ---------- SCANNER ----------
let zxingReader = null, mediaStream = null;
let ocrLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(ocrLoading) return ocrLoading;
  ocrLoading = new Promise((res,rej)=>{
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    sc.onload = res;
    sc.onerror = ()=>{ ocrLoading = null; rej(new Error("ocr")); };
    document.head.appendChild(sc);
  });
  return ocrLoading;
}
function parseLotFromText(txt){
  const t = String(txt||"").replace(/\|/g,"I");
  const re = /(?:\blotto\b|\blot\b|\bl\.?\s*(?=[:\-]))\s*(?:numero|num\.?|nr\.?|n\.?|n[°º]|no\.?)?\s*[:.\-]?\s*([A-Z0-9][A-Z0-9\/\-\.]{2,})/i;
  const m = re.exec(t);
  if(m) return m[1].replace(/[.\-]+$/,"").toUpperCase();
  const nums = (t.match(/\b[0-9]{6,14}\b/g)||[]).sort((a,b)=>b.length-a.length);
  return nums.length ? nums[0] : "";
}
function parseLotStrict(txt){
  const t = String(txt||"").replace(/\|/g,"I");
  const re = /\blott?o\b\s*(?:numero|num\.?|nr\.?|n\.?|n[°º]|no\.?)?\s*[:.\-]?\s*([A-Z0-9][A-Z0-9\/\-\.]{3,})/gi;
  let m;
  while((m = re.exec(t))){
    const v = m[1].replace(/[.\-]+$/,"").toUpperCase();
    if(/[0-9]/.test(v)) return v;
  }
  return "";
}
function showLotConfirm(lot, text, cb){
  showModal(`<h3>Lotto letto dall'etichetta</h3>

    <details style="margin-top:8px;"><summary style="font-size:12px;">Tutto il testo letto</summary><pre style="white-space:pre-wrap; font-size:11px;">${esc(text||"")}</pre></details>

  document.getElementById("ocrOk").onclick = ()=>{
    const v = document.getElementById("ocrLotInput").value.trim();
    closeModal();
    if(v && cb) cb(v);
  };
}
let autoOcrOn = false, autoOcrWorker = null;
async function autoOcrLoop(){
  if(autoOcrOn) return;
  autoOcrOn = true;
  const hint = ()=>document.getElementById("scanHint");
  try{
    await loadTesseract();
    if(!autoOcrWorker) autoOcrWorker = await Tesseract.createWorker("eng");
  }catch(e){ autoOcrOn = false; return; }
  while(autoOcrOn){
    const v = document.getElementById("scanVideo");
    if(v && v.videoWidth){
      const c = document.createElement("canvas");
      const k = Math.min(1, 1400 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth*k); c.height = Math.round(v.videoHeight*k);
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      try{
        const r = await autoOcrWorker.recognize(c);
        if(!autoOcrOn) break;
        const text = (r && r.data && r.data.text) || "";
        const lot = parseLotStrict(text);
        if(lot){
          const cb = scanTarget;
          closeScanner();
          showLotConfirm(lot, text, cb);
          break;
        }
      }catch(e){}
    }
    await new Promise(r=>setTimeout(r, 400));
  }
}
async function ocrLabel(src, cb){
  showModal(`<p>⏳ Leggo la scritta dell'etichetta... la prima volta può volerci un po'.</p>`);
  try{
    await loadTesseract();
    const r = await Tesseract.recognize(src, "eng");
    const text = (r && r.data && r.data.text) || "";
    const lot = parseLotFromText(text);
    showLotConfirm(lot, text, cb);
  }catch(e){
    notify("Non sono riuscito a leggere la scritta (la prima volta serve internet). Scrivi il lotto a mano.");
  }
}
function ocrFromScanner(){
  const v = document.getElementById("scanVideo");
  if(!v || !v.videoWidth){ notify("La fotocamera non è ancora pronta. Riprova tra un attimo."); return; }
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  const cb = scanTarget;
  closeScanner();
  ocrLabel(c, cb);
}
function scanFailed(msg){
  showModal(`<h3>Fotocamera dal vivo non disponibile</h3>
    <p style="font-size:13px;">${esc(msg)}</p>
    <p style="font-size:12px; color:var(--sub);">Puoi scattare una foto al codice: lo leggo io dalla foto.</p>
    <div class="row">
      <button class="btn-ghost" onclick="closeModal()">Annulla</button>
      <button class="btn-main" onclick="closeModal(); scanByPhoto();">📷 Scatta una foto</button>
    </div>`);
}
function scanByPhoto(){
  const cb = scanTarget;
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture","environment");
  inp.onchange = async ()=>{
    const file = inp.files && inp.files[0];
    if(!file) return;
    if(!window.ZXing){
      try{ const u = await compressImage(file, 1600, 0.8); ocrLabel(u, cb); }catch(e){ notify("Non sono riuscito a leggere la foto. Scrivi il lotto a mano."); }
      return;
    }
    let url = null;
    try{
      url = await compressImage(file, 1600, 0.8);
      const reader = makeZxingReader();
      const result = await reader.decodeFromImageUrl(url);
      if(result && cb) cb(result.getText());
    }catch(e){
      if(url) ocrLabel(url, cb);
      else notify("Non sono riuscito a leggere la foto. Riprova, oppure scrivi il lotto a mano.");
    }
  };
  inp.click();
}
function makeZxingReader(){
  const hints = new Map();
  try{
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const F = ZXing.BarcodeFormat;
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.QR_CODE, F.DATA_MATRIX, F.CODE_128, F.CODE_39, F.CODE_93, F.PDF_417, F.AZTEC].filter(Boolean));
  }catch(e){}
  return new ZXing.BrowserMultiFormatReader(hints, 200);
}
function openScanner(onDecode){
  scanTarget = onDecode;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scanFailed("Il browser non permette la fotocamera dal vivo in questa pagina.");
    return;
  }
  document.getElementById("scanOverlay").style.display = "flex";
  const video = document.getElementById("scanVideo");
  if(!window.ZXing){ closeScanner(); scanFailed("Il lettore di codici non si è caricato (controlla la connessione)."); return; }
  let lastBar = "", barCount = 0;
  zxingReader = makeZxingReader();
  autoOcrLoop();
  zxingReader.decodeFromConstraints(
    { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } }, video,
    (result, err) => {
      if(result){
        const text = result.getText();
        if(text === lastBar){ barCount++; } else { lastBar = text; barCount = 1; }
        if(barCount >= 2){
          const cb = scanTarget;
          closeScanner();
          if(cb) cb(text);
        }
      }
    }
  ).catch(err=>{
    closeScanner();
    const name = err && err.name;
    if(name==="NotAllowedError"){
      showModal(`<h3>Permesso fotocamera negato</h3>
        <p style="font-size:13px;">Il browser non può usare la fotocamera per questa pagina finché non glielo consenti.</p>
        <p style="font-size:12px; color:var(--sub);">iPhone: il tasto qui sotto apre le Impostazioni — poi vai su Safari (o sul browser che usi) → Fotocamera → Consenti, e torna qui. Android: non è possibile aprire le impostazioni dal sito — vai tu in Impostazioni → App → il tuo browser → Autorizzazioni → Fotocamera.</p>
        <div class="row">
          <button class="btn-ghost" onclick="closeModal(); scanByPhoto();">📷 Scatta una foto</button>
          <button class="btn-main" onclick="try{location.href='app-settings:'}catch(e){}; closeModal();">📱 Apri impostazioni</button>
        </div>`);
      return;
    }
    let msg = "Fotocamera non disponibile.";
    if(name==="NotFoundError") msg = "Nessuna fotocamera trovata su questo dispositivo.";
    else if(name==="NotReadableError") msg = "La fotocamera è già in uso da un'altra app. Chiudila e riprova.";
    else if(name) msg = "Errore fotocamera: " + name;
    scanFailed(msg);
  });
}
function closeScanner(){
  autoOcrOn = false;
  document.getElementById("scanOverlay").style.display = "none";
  try{ zxingReader && zxingReader.reset(); }catch(e){}
}
document.getElementById("scanClose").onclick = closeScanner;

function togglePwVisibility(){
  const inp = document.getElementById("profilePw");
  const btn = document.getElementById("pwToggle");
  if(inp.type === "password"){ inp.type = "text"; btn.textContent = "🙈"; }
  else { inp.type = "password"; btn.textContent = "👁️"; }
}
function renderLogin(){
  app.innerHTML = `
  <div id="loginScreen">
    <div class="logo-badge">🐘</div>
    <div class="brand">BA-BAR GROUP<small>GESTIONE HACCP</small></div>
    <div class="card login-card">
      <label class="subhead">Chi deve entrare?</label>
      <select id="profileSelect">
        <option value="">Seleziona...</option>
        <option value="Admin">Admin</option>
        <option value="La Nova Central">La Nova Central</option>
        <option value="Officina">Officina</option>
        <option value="BabarHouse">BabarHouse</option>
        <option value="Ba Bar Echia">Ba Bar Echia</option>
      </select>
      <label>Password</label>
      <div style="position:relative;">
        <input id="profilePw" type="password" autocomplete="off" style="padding-right:42px;">
        <button type="button" id="pwToggle" onclick="togglePwVisibility()" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:18px; cursor:pointer; padding:6px 8px; line-height:1;">👁️</button>
      </div>
      <button class="btn-main" style="margin-top:14px;" onclick="doLogin()">Entra</button>
      <div id="loginErr" style="color:var(--danger); font-size:12px; margin-top:8px; display:none;">Password errata.</div>
    </div>
  </div>`;
  const sel = document.getElementById("profileSelect");
  if(currentProfile) sel.value = currentProfile;
  document.getElementById("profilePw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}
function doLogin(){
  const v = document.getElementById("profileSelect").value;
  const pw = document.getElementById("profilePw").value;
  if(!v){ notify("Seleziona chi sta entrando."); return; }
  if(dbErr){
    showModal(`<p>Archivio non disponibile: il telefono non è riuscito a collegarsi al database.</p><p style="font-size:11px; color:var(--sub);">${esc(dbErrMsg||"")}</p><div class="row"><button class="btn-ghost" onclick="closeModal()">Chiudi</button><button class="btn-main" onclick="location.reload()">Riprova</button></div>`);
    return;
  }
  if(pw !== PASSWORDS[v]){ document.getElementById("loginErr").style.display = "block"; return; }
  currentProfile = v;
  try{ localStorage.setItem("haccp_profile", v); }catch(e){}
  if(deepLinkSheetId) goTab("sheetView");
  else if(deepLinkDishId){ currentDishId = deepLinkDishId; goTab("dishDetail"); }
  else goTab("home");
}
function logout(){
  currentProfile = "";
  currentTempArea = null; tempLoc = '';
  try{ localStorage.removeItem("haccp_profile"); }catch(e){}
  goTab("login");
}

function goTab(t){ tab=t; editingLotId=null; editingFatturaId=null; fatturaPhoto=""; render(); }
function visibleLots(){ return currentProfile==="Admin" ? LOTS : LOTS.filter(l=>l.location===currentProfile); }
function visibleSheets(){ return currentProfile==="Admin" ? SHEETS : SHEETS.filter(s=>s.location===currentProfile); }
function visibleFridges(){ return currentProfile==="Admin" ? FRIDGES : FRIDGES.filter(f=>f.location===currentProfile); }
function visibleDishes(){ return currentProfile==="Admin" ? DISHES : DISHES.filter(d=>d.location===currentProfile); }

  const settingsTile = currentProfile==="Admin" ? `<div class="tile" onclick="goTab('settings')"><div class="ic">🛠️</div><div class="lbl">Impostazioni</div></div>` : "";
  app.innerHTML = `
    <div class="homehead">Connesso come: <b>${esc(currentProfile)}</b></div>

    <div class="grid">

const ATT_AREAS = {"La Nova Central":["Cucina","Sala"], "Officina":["Cucina","Sala"], "BabarHouse":["Cucina","Sala","Pizzeria"], "Ba Bar Echia":["Sala"]};
function attAreasFor(loc){ return ATT_AREAS[loc] || ["Cucina","Sala"]; }
function openAttestati(){
  showModal(`<h3>Attestati HACCP</h3>
    <label>Password</label><input id="att_pw" type="password" inputmode="numeric" autocomplete="off">
    <div id="att_err" style="color:var(--danger); font-size:12px; display:none; margin-top:6px;">Password errata.</div>
    <div class="row"><button class="btn-ghost" onclick="closeModal()">Annulla</button><button class="btn-main" id="att_ok">Entra</button></div>`);
  const go = ()=>{
    const v = document.getElementById("att_pw").value;
    if(v !== String(PASSWORDS.Attestati || DEFAULT_PW.Attestati)){ document.getElementById("att_err").style.display = "block"; return; }
    closeModal();
    attUnlocked = true; attArea = "";
    attLocation = currentProfile==="Admin" ? "" : currentProfile;
    goTab("attestati");
  };
  document.getElementById("att_ok").onclick = go;
  document.getElementById("att_pw").addEventListener("keydown", e=>{ if(e.key==="Enter") go(); });
  setTimeout(()=>{ const i = document.getElementById("att_pw"); if(i) i.focus(); }, 50);
}
function attPickLoc(i){ attLocation = LOCATIONS[i]; attArea = ""; render(); }
function attPickArea(i){ attArea = attAreasFor(attLocation)[i]; render(); }
function attBack(){
  if(attArea){ attArea = ""; render(); }
  else if(currentProfile==="Admin" && attLocation){ attLocation = ""; render(); }
  else goTab("home");
}
function attDays(exp){
  if(!exp) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(exp); if(!m) return null;
  const t = new Date(); const today = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((Date.UTC(+m[1], +m[2]-1, +m[3]) - today) / 86400000);
}
function attExpPill(a){
  const d = attDays(a.expiry);
  if(d === null) return "";
  if(d < 0) return `<span class="pill danger">Scaduto</span>`;

async function attFileChosen(inp){
  const file = inp.files && inp.files[0]; inp.value = "";
  if(!file) return;
  try{
    const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
    let data, kind;
    if(isPdf){
      if(file.size > 2.5*1024*1024){ notify("Il PDF è troppo grande (massimo 2,5 MB). Scatta una foto oppure riduci il PDF."); return; }
      data = await new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      data = "data:application/pdf;base64," + String(data).split(",")[1];
      kind = "pdf";
    }else{
      data = await compressImage(file, 1600, 0.7);
      if(data.length > 900000) data = await compressImage(file, 1200, 0.55);
      kind = "image";
    }
    attPending = { data, kind, fileName: file.name || "" };
    const old = attRenewId ? ATTESTATI.find(x=>x.id===attRenewId) : null;
    askForm(old ? "Attestato rinnovato" : "Nuovo attestato", [{id:"name", label:"Nome del collaboratore", value: old ? old.name : ""},{id:"exp", label:"Scadenza attestato (facoltativa)", type:"date"}], v=>attSave(v));
  }catch(e){ notify("Non sono riuscito a leggere il file. Riprova."); }
}
async function attSave(v){
  const p = attPending; attPending = null;
  const renewId = attRenewId; attRenewId = null;
  if(!p) return;
  const id = uid(), CH = 700000, parts = [];
  for(let i=0; i<p.data.length; i+=CH) parts.push(p.data.slice(i, i+CH));
  try{
    for(let i=0; i<parts.length; i++) await db.collection("attestati_files").doc(id+"_"+i).set({ attId:id, idx:i, data:parts[i] });
    const rec = { id, location:attLocation, area:attArea, name:(v.name||"Senza nome"), expiry:(v.exp||""), added:new Date().toISOString().slice(0,10), kind:p.kind, fileName:p.fileName, parts:parts.length };
    await db.collection("attestati").doc(id).set(rec);
    ATTESTATI.unshift(rec);
    if(renewId && renewId !== id){
      const old = ATTESTATI.find(x=>x.id===renewId);
      for(let i=0; i<((old && old.parts) || 1); i++){ try{ await db.collection("attestati_files").doc(renewId+"_"+i).delete(); }catch(e){} }
      try{ await db.collection("attestati").doc(renewId).delete(); }catch(e){}
      ATTESTATI = ATTESTATI.filter(x=>x.id!==renewId);
    }
    notify(renewId ? "Attestato rinnovato." : "Attestato salvato.");
    render();
  }catch(e){ notify("Non sono riuscito a salvare l'attestato: " + String((e && (e.code || e.message)) || e)); }
}
async function attOpen(id){
  const a = ATTESTATI.find(x=>x.id===id); if(!a) return;
  showModal(`<p>⏳ Carico l'attestato...</p>`);
  try{
    let data = "";
    for(let i=0; i<(a.parts||1); i++){
      const d = await db.collection("attestati_files").doc(id+"_"+i).get();
      data += ((d && d.data && d.data()) || {}).data || "";
    }
    if(!data) throw new Error("vuoto");
    if(a.kind==="pdf"){
      const bin = atob(data.split(",")[1]); const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
      showModal(`<h3>${esc(a.name||"Attestato")}</h3>
        <a href="${url}" target="_blank" rel="noopener" style="display:block; text-align:center; text-decoration:none; padding:12px; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-weight:600;">📄 Apri PDF</a>

      showModal(`<h3>${esc(a.name||"Attestato")}</h3><img src="${data}" alt="Attestato" style="max-width:100%; max-height:65vh; display:block; margin:0 auto 10px;"><button class="btn-main" style="width:100%;" onclick="closeModal()">Chiudi</button>`);

  }catch(e){ closeModal(); notify("Non sono riuscito ad aprire l'attestato."); }
}
async function attDelete(id){

  if(!rec){
    const defDays = [2,9,16,23,30];
    rec = { location: saniLocation, month,
      daily: SANI_DAILY_ROWS.map(()=>Array(31).fill(false)),
      weekly: SANI_WEEKLY_ROWS.map(()=>Array(5).fill(false)),
      weeklyDates: defDays.map(d=>month+"-"+String(d).padStart(2,"0")),
      opResp: "", haccpResp: "" };
    SANI.unshift(rec); // register immediately so rapid taps reuse this same object
  }
  if(!rec.weeklyDates){ const defDays=[2,9,16,23,30]; rec.weeklyDates = defDays.map(d=>rec.month+"-"+String(d).padStart(2,"0")); }
  // self-heal: rebuild daily/weekly if malformed (wrong shape from older/corrupted saves)
  if(!Array.isArray(rec.daily) || rec.daily.length!==SANI_DAILY_ROWS.length || rec.daily.some(r=>!Array.isArray(r) || r.length<31)){
    rec.daily = SANI_DAILY_ROWS.map((_,ri)=> (Array.isArray(rec.daily) && Array.isArray(rec.daily[ri])) ? Array(31).fill(false).map((v,i)=>rec.daily[ri][i]||false) : Array(31).fill(false));
  }
  if(!Array.isArray(rec.weekly) || rec.weekly.length!==SANI_WEEKLY_ROWS.length || rec.weekly.some(r=>!Array.isArray(r) || r.length<5)){
    rec.weekly = SANI_WEEKLY_ROWS.map((_,ri)=> (Array.isArray(rec.weekly) && Array.isArray(rec.weekly[ri])) ? Array(5).fill("").map((v,i)=>rec.weekly[ri][i]||"") : Array(5).fill(""));
  }
  return rec;
}

function abbTimeFmt(el){
  let d = el.value.replace(/\D/g,"").slice(0,4);
  el.value = d.length>2 ? d.slice(0,2)+":"+d.slice(2) : d;
}
function abbTimeSave(field, el){
  let v = el.value.trim();
  if(v){
    const m = v.match(/^(\d{1,2})(?::?(\d{2}))?$/);
    if(!m || +m[1]>23 || (m[2] && +m[2]>59)){ notify("Orario non valido: scrivilo come 14:30."); el.value = ""; v = ""; }
    else v = String(+m[1]).padStart(2,"0")+":"+(m[2]||"00");
  }
  el.value = v;
  updateAbbHeader(field, v, true);
}

async function aiSuggestAbbEndTime(btn){
  const rec = ABBATTIMENTI.find(a=>a.id===abbCurrentId);
  if(!rec) return;
  const rowProdotto = (rec.lots && rec.lots[0] && rec.lots[0].produttore) ? rec.lots[0].produttore.trim() : "";
  const prodotto = (rec.prodotto||"").trim() || (rec.nome||"").trim() || rowProdotto;
  if(!prodotto){ notify("Scrivi prima il nome del prodotto (in testa alla scheda, oppure in \"Identificazione del produttore\" nella prima riga)."); return; }
  if(!rec.oraInizio){ notify("Inserisci prima l'ora di inizio abbattimento."); return; }
  const oldTxt = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "⏳"; }
  try{
    const res = suggestAbbEndTime(prodotto, rec.data, rec.oraInizio);
    if(btn){ btn.disabled = false; btn.textContent = oldTxt; }
    render();
    const note = document.getElementById("abbAiNote");
    if(note){
      const riga1 = (res && res.chillHours!=null && res.temperatura)
        ? `⏱️ <b>Durata abbattimento: ${res.chillHours} ore</b> &nbsp; 🕒 <b>Fine consigliata: ${esc(res.oraFine)}</b> &nbsp; 🌡️ <b>Temperatura: ${esc(res.temperatura)}</b><br>`
        : "";
      note.innerHTML = riga1 + "💡 " + esc(res && res.note ? res.note : "Suggerimento generato.") + (res && res.giorniSuccessivi>0 ? " Attenzione: l'abbattimento si conclude il giorno successivo." : "") + " Verifica sempre con il tuo piano HACCP aziendale prima di confermare.";
      note.style.display = "block";
    }
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = oldTxt; }
    notify("Non sono riuscito a generare un suggerimento in questo momento.");
  }
}
function clearAbbLotScad(i, btn){
  const input = btn && btn.parentElement ? btn.parentElement.querySelector('input[type="date"]') : null;
  if(input) input.value = "";
  updateAbbLot(i, 'scadenza', '');
}
async function aiSuggestAbbExpiry(i, btn){
  const rec = ABBATTIMENTI.find(a=>a.id===abbCurrentId);
  if(!rec) return;
  const rowProdotto = (rec.lots && rec.lots[i] && rec.lots[i].produttore) ? rec.lots[i].produttore.trim() : "";
  const prodotto = (rec.prodotto||"").trim() || (rec.nome||"").trim() || rowProdotto;
  if(!prodotto){ notify("Scrivi prima il nome del prodotto (in testa alla scheda, oppure in \"Identificazione del produttore\" su questa riga)."); return; }
  const oldTxt = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "⏳"; }
  try{
    const dataBase = rec.data || new Date().toISOString().slice(0,10);
    const riferimento = dataBase + (rec.oraFine ? ("T"+rec.oraFine) : "T00:00");
    const res = suggestAbbExpiry(prodotto, riferimento);
    if(res && res.scadenza){
      await updateAbbLot(i, 'scadenza', String(res.scadenza).slice(0,10));
    }
    if(res && res.note) notify("💡 " + res.note + " Verifica sempre con il tuo piano HACCP aziendale prima di confermare.");
  }catch(e){
    notify("Non sono riuscito a generare un suggerimento in questo momento.");
  }
  if(btn){ btn.disabled = false; btn.textContent = oldTxt; }
  render();
}
function scanAbbLot(i){
  openScanner(async text=>{
    const rec = ABBATTIMENTI.find(a=>a.id===abbCurrentId);
    if(!rec) return;
    if(!Array.isArray(rec.lots)) rec.lots = [];
    if(!rec.lots[i]) rec.lots[i] = {};
    rec.lots[i].lotto = text;
    const match = LOTS.find(l=>l.barcode===text);
    if(match && !rec.lots[i].produttore) rec.lots[i].produttore = match.supplier||"";
    render();
    await saveAbb(rec);
  });
}
async function updateAbbLot(i, field, value){
  const rec = ABBATTIMENTI.find(a=>a.id===abbCurrentId);
  if(!rec) return;
  if(!Array.isArray(rec.lots)) rec.lots = [];
  if(!rec.lots[i]) rec.lots[i] = {};
  rec.lots[i][field] = value;
  // la tabella mostra sempre almeno 12 righe: ridisegna solo se serve farne comparire altre oltre le 12,
  // altrimenti evita di ridisegnare per non interrompere il selettore data del telefono mentre si scrive
  if(i >= 11) render();
  await saveAbb(rec);
}
function deleteAbbLot(i){
  askConfirm("Eliminare questo lotto dalla scheda?", async ()=>{
    const rec = ABBATTIMENTI.find(a=>a.id===abbCurrentId);
    if(!rec) return;
    rec.lots.splice(i,1);
    render();
    await saveAbb(rec);
  });
}

  const extra = [f.supplier, f.number ? "n. "+f.number : "", f.products, f.notes].filter(Boolean).map(esc).join(" · ");
  return `<div class="item">
    <div style="display:flex; gap:10px; align-items:center;">
      ${thumb}
      <div style="flex:1; min-width:0;">
        <div class="top"><span class="name">Fattura del ${esc(fmtDate(f.date))}</span></div>
        <div class="meta">${locTag.replace(/^ · /,"")}</div>

}

  const isAdmin = currentProfile==="Admin";
  if(isAdmin && !magFolder){
    const altri = fattureOf("__altro").length;
    const tiles = LOCATIONS.map((l,i)=>`<div class="tile" onclick="magPickFolder(${i})"><div class="ic">📁</div><div class="lbl">${esc(l)}<br><small>${fattureOf(l).length} fatture</small></div></div>`).join("")

    return;
  }
  const baseList = isAdmin ? fattureOf(magFolder) : visibleFatture();
  const list = baseList.slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
  const groups = {};
  list.forEach(f=>{
    const m = /^(\d{4})-(\d{2})/.exec(f.date||"");
    const key = m ? m[1]+"-"+m[2] : "0000-00";
    (groups[key] = groups[key] || []).push(f);
  });
  const keys = Object.keys(groups).sort().reverse();
  const rows = keys.length ? keys.map((k,idx)=>{
    const label = k==="0000-00" ? "Senza data" : MESI[parseInt(k.slice(5),10)-1]+" "+k.slice(0,4);

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onFatturaPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    let data = await compressImage(file, 1600, 0.65);
    if(data.length > 800000) data = await compressImage(file, 1200, 0.5);
    fatturaPhoto = data;
    showFatturaPreview();
  }catch(e){ notify("Non sono riuscito a leggere la foto. Riprova."); }
  input.value = "";
}

  const inp = document.createElement("input");

  inp.onchange = async ()=>{
    const file = inp.files && inp.files[0];

function showDishSuggest(){
  const box = document.getElementById("dishSuggest"), inp = document.getElementById("e_product");
  if(!box || !inp) return;
  const q = inp.value.trim().toLowerCase();
  const seen = new Set();
  let list = visibleDishes().filter(d=>{
    const n = (d.name||"").trim(); const k = n.toLowerCase();
    if(!n || seen.has(k)) return false; seen.add(k); return true;
  }).sort((a,b)=>(a.name||"").localeCompare(b.name||"","it"));
  if(q){
    const starts = list.filter(d=>d.name.toLowerCase().startsWith(q));
    const contains = list.filter(d=>!d.name.toLowerCase().startsWith(q) && d.name.toLowerCase().includes(q));
    list = starts.concat(contains);
  }
  if(!list.length){ box.style.display = "none"; return; }
  box.innerHTML = list.slice(0,40).map(d=>`<div data-id="${esc(d.id)}">${esc(d.name)}${currentProfile==="Admin" && d.location ? `<small>${esc(d.location)}</small>` : ""}</div>`).join("");
  box.querySelectorAll("div").forEach(el=>{
    const pick = ()=>{
      const d = DISHES.find(x=>x.id===el.getAttribute("data-id"));
      if(d){ inp.value = d.name; }
      hideDishSuggest();
    };
    let sy = null, moved = false;
    el.addEventListener("touchstart", e=>{ sy = e.touches[0].clientY; moved = false; }, {passive:true});
    el.addEventListener("touchmove", e=>{ if(sy!==null && Math.abs(e.touches[0].clientY - sy) > 8) moved = true; }, {passive:true});
    el.addEventListener("touchend", e=>{ if(!moved){ e.preventDefault(); pick(); } sy = null; });
    el.addEventListener("mousedown", e=>{ e.preventDefault(); pick(); });
  });
  box.style.display = "block";
}

function fmtOre(h){
  const min = Math.round(h*60);
  if(min < 120 && h !== Math.floor(h)) return min + " minuti";
  if(min % 60 === 0) return (min/60) + (min/60===1 ? " ora" : " ore");
  return Math.floor(min/60) + " ore e " + (min%60) + " minuti";
}
async function aiSuggest(){
  const product = document.getElementById("e_product").value.trim();
  const start = document.getElementById("e_start").value;
  const frozen = document.getElementById("e_frozen").value;
  if(!product){ notify("Inserisci almeno il nome del prodotto."); return; }
  const btn = document.getElementById("aiBtn");
  btn.disabled = true; const oldTxt = btn.textContent; btn.textContent = "🤖 Sto pensando...";
  try{
    const res = suggestLabelAi(product, frozen, start);
    const R = (t)=>`<div style="margin-top:4px;">${t}</div>`;
    const dt = (iso)=> fmtDate(iso.slice(0,10)) + " " + iso.slice(11,16);
    let html = `<div><b>💡 Categoria:</b> ${esc(res.label)}</div>`;
    html += R(`⏱️ <b>Durata abbattimento:</b> ${esc(fmtOre(res.chillHours))}`);
    html += R(`🌡️ <b>Temperatura consigliata:</b> ${esc(res.tempLabel)}`);
    if(res.endChill) html += R(`🕒 <b>Fine abbattimento consigliata:</b> ${esc(dt(res.endChill))}`);
    else html += R(`🕒 <b>Fine abbattimento:</b> scrivi l'inizio e ti dico l'ora di fine consigliata.`);
    if(res.expiry) html += R(`📅 <b>Scadenza consigliata:</b> ${esc(fmtDate(res.expiry))} (48 ore dopo la fine dell'abbattimento)`);
    else html += R(`📅 <b>Scadenza:</b> circa ${res.shelfDays} giorni dopo l'abbattimento in frigorifero.`);
    if(res.frozenExpiry) html += R(`❄️ <b>Scadenza congelato consigliata:</b> ${esc(fmtDate(res.frozenExpiry))}`);
    else html += R(`❄️ <b>Congelato:</b> conservazione tipica ${res.frozenMonths} mesi a -18°C.`);
    html += R(esc(res.ruleNote));
    html += R(`<i>Sono solo consigli: compila tu i campi. Verifica sempre con il tuo piano HACCP aziendale.</i>`);
    const note = document.getElementById("aiNote");
    note.innerHTML = html;
    note.style.display = "block";
  }catch(e){
    notify("Non sono riuscito a generare un suggerimento in questo momento.");
  }
  btn.disabled = false; btn.textContent = oldTxt;
}

      lot: document.getElementById("e_lot").value.trim(),
      date: document.getElementById("e_date").value,

    <div id="qrBox"></div>`;
  const url = location.origin + location.pathname + "?dish=" + encodeURIComponent(s.dishId || "");
  try{ new QRCode(document.getElementById("qrBox"), {text:url, width:120, height:120}); }catch(e){}
  card.scrollIntoView({behavior:"smooth"});
  window.__lastLabel = s;
}
async function shareLabelImage(){
  const s = window.__lastLabel; if(!s){ notify("Genera prima un'etichetta."); return; }
  try{
    const qrCanvas = document.querySelector("#qrBox canvas");
    const W = 360, lineH = 24;
    const lines = [
      s.operator ? "Operatore: "+s.operator : "",
      s.date ? "Data: "+fmtDate(s.date) : "",
      s.lot ? "Lotto: "+s.lot : "",
      s.frozen ? "Data congelato: "+fmtDate(s.frozen) : "",
      s.thawed ? "Scadenza congelato: "+fmtDate(s.thawed) : "",
      s.startChill ? "Inizio abbattimento: "+s.startChill.replace("T"," ") : "",
      s.endChill ? "Fine abbattimento: "+s.endChill.replace("T"," ") : "",
      s.expiry ? "Scadenza: "+fmtDate(s.expiry) : "",
      s.gradi ? "Gradi: "+s.gradi+" °C" : "",
    ].filter(Boolean);
    const H = 70 + lines.length*lineH + (qrCanvas?100:12);
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#000"; ctx.textAlign = "center";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText(s.product||"", W/2, 36);
    ctx.font = "14px sans-serif";
    let y = 64;
    lines.forEach(l=>{ ctx.fillText(l, W/2, y); y += lineH; });
    if(qrCanvas){ ctx.drawImage(qrCanvas, W/2-45, y+4, 90, 90); }
    const dataUrl = canvas.toDataURL("image/png");

    // Try the native share sheet first (best UX when it works)
    let shared = false;
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const file = new File([blob], (s.product||"etichetta")+".png", {type:"image/png"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: s.product||"Etichetta"});
        shared = true;
      }
    }catch(e){ /* share unavailable or cancelled: fall through to visible image */ }

    if(!shared){
      showModal(`<h3>${esc(s.product||"Etichetta")}</h3>
        <img src="${dataUrl}" style="width:100%; border-radius:8px; border:1px solid var(--line);">
        <p style="font-size:12px; color:var(--sub); margin-top:8px;">Tieni premuto sull'immagine qui sopra per salvarla o condividerla direttamente nell'app della tua stampante.</p>
        <button class="btn-main" style="width:100%; margin-top:6px;" onclick="closeModal()">Chiudi</button>`);
    }
  }catch(err){
    notify("Non sono riuscito a creare l'immagine: " + (err && err.message ? err.message : err));
  }
}

function dishRowsHtml(dishes, showLoc){
  return dishes.map(d=>{
    const n = INGREDIENTS.filter(i=>i.dishId===d.id).length;
    return `<div class="item">
      <div onclick="openDish('${d.id}')" style="cursor:pointer;">
        <div class="top"><span class="name">${esc(d.name)}</span><span class="pill">${n} ingr.</span></div>
        ${showLoc ? `<div class="meta">Reparto: ${esc(d.location||"-")}</div>` : ""}
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn-danger" onclick="confirmDeleteDish('${d.id}')">Elimina</button>
      </div>
    </div>`;
  }).join("");
}
function prodDishesOf(folder){
  return folder==="__altro" ? DISHES.filter(d=>!LOCATIONS.includes(d.location)) : DISHES.filter(d=>d.location===folder);
}
function prodPickFolder(i){ prodFolder = i===-1 ? "__altro" : LOCATIONS[i]; render(); }
function renderProduzione(){
  if(currentProfile==="Admin"){
    if(!prodFolder){
      const altri = prodDishesOf("__altro").length;
      const tiles = LOCATIONS.map((l,i)=>`<div class="tile" onclick="prodPickFolder(${i})"><div class="ic">📁</div><div class="lbl">${esc(l)}<br><small>${prodDishesOf(l).length} schede</small></div></div>`).join("")
        + (altri ? `<div class="tile" onclick="prodPickFolder(-1)"><div class="ic">📁</div><div class="lbl">Altre schede<br><small>${altri} schede</small></div></div>` : "");
      app.innerHTML = `<div class="card"><button class="btn-ghost" onclick="goTab('home')">← Home</button><h2 style="margin-top:10px;">Schede di produzione</h2></div><div class="grid">${tiles}</div>`;
      return;
    }
    const inAltro = prodFolder==="__altro";
    const list = prodDishesOf(prodFolder).slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"it"));
    const rows = dishRowsHtml(list, inAltro) || `<div class="empty">Nessuna scheda ancora in questa cartella.</div>`;
    app.innerHTML = `
      <div class="card">
        <button class="btn-ghost" onclick="prodFolder=''; render();">← Cartelle</button>
        <h2 style="margin-top:10px;">${inAltro ? "Altre schede" : esc(prodFolder)}</h2>
        <button class="btn-main" onclick="addDish()">➕ Aggiungi scheda</button>
      </div>
      <div class="card">${rows}</div>`;
    return;
  }
  const dishes = visibleDishes();
  const rows = dishRowsHtml(dishes, false) || `<div class="empty">Nessuna scheda ancora. Aggiungine una.</div>`;
  app.innerHTML = `
    <div class="card">
      <button class="btn-ghost" onclick="goTab('home')">← Home</button>
      <h2 style="margin-top:10px;">Schede di produzione</h2>
      <button class="btn-main" onclick="addDish()">➕ Aggiungi scheda</button>
    </div>
    <div class="card">${rows}</div>
  `;
}
function addDish(){
  askForm("Nuova scheda di produzione", [{id:"name", label:"Nome piatto (es. Crocchè, Parmigiana)"}], async v=>{
    if(!v.name) return;
    const loc = (currentProfile==="Admin" && prodFolder && prodFolder!=="__altro") ? prodFolder : currentProfile;
    await saveDish({ name: v.name, location: loc });
    render();
  });
}
function openDish(id){ currentDishId = id; goTab("dishDetail"); }

function renderDishDetail(){
  const d = DISHES.find(x=>x.id===currentDishId);
  if(!d){ goTab("produzione"); return; }
  const authorized = currentProfile==="Admin" || d.location===currentProfile;
  if(!authorized){
    app.innerHTML = `<div class="card"><h2>${esc(d.name)}</h2><p>Non visibile con questo profilo.</p><button class="btn-main" onclick="goTab('produzione')">Torna alle schede</button></div>`;
    return;
  }
  const ings = INGREDIENTS.filter(i=>i.dishId===d.id);
  const tableRows = ings.map(i=>`<tr>
    <td>${esc(i.name)}</td>
    <td>${esc(i.supplier||"")}</td>
    <td>${esc(i.lot||"")} <button class="btn-ghost no-print" style="font-size:12px; padding:3px 6px;" onclick="changeLotAuto('${i.id}')" title="Scansiona il lotto">📷</button></td>
    <td>${esc(i.operator||"")}</td>
    <td class="no-print">
      <button class="btn-ghost" style="font-size:11px; padding:4px 6px;" onclick="changeLotManual('${i.id}')" title="Modifica ingrediente">✏️ Modifica</button>
      <button class="btn-danger" style="font-size:11px; padding:4px 6px;" onclick="askConfirm('Rimuovere ingrediente?', ()=>deleteIngredient('${i.id}'))">🗑️</button>
    </td>
  </tr>`).join("") || `<tr><td colspan="5" style="text-align:center; color:#777;">Nessun ingrediente. Aggiungine uno qui sotto.</td></tr>`;
  const prodDate = d.prodDate || new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <button class="btn-ghost" onclick="goTab('produzione')">← Schede</button>
      <h2 style="margin-top:10px;">${esc(d.name)}</h2>
      <button class="btn-ghost" style="width:100%;" onclick="renameDish('${d.id}')">✏️ Rinomina piatto</button>
    </div>
    <div class="card paper">
      <div id="printSheetArea">
        <div class="doc-top">MANUALE DI AUTOCONTROLLO IGIENICO - SANITARIO</div>
        <h3>SCHEDA DI PREPARAZIONE DEI LOTTI</h3>
        <div class="meta-line"><b>Produzione:</b> ${esc(d.name)}</div>
        <div class="meta-line no-print">
          <b>Data di Produzione:</b>
          <input type="date" value="${prodDate}" style="width:auto; display:inline-block; padding:2px 6px;" onchange="saveDishDate('${d.id}',this.value)">
        </div>
        <div class="meta-line print-only"><b>Data di Produzione:</b> ${fmtDate(prodDate)}</div>
        <table class="sched-table">
          <thead><tr><th>Ingredienti</th><th>Fornitore</th><th>Lotto</th><th>Operatore</th><th class="no-print">Azioni</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      <button class="btn-main no-print" style="margin-top:10px;" onclick="window.print()">🖨️ Stampa scheda</button>
    </div>
    <div class="card no-print">
      <h2>Aggiungi ingrediente</h2>
      <label>Nome ingrediente</label><input id="ni_name" placeholder="Nome ingrediente">
      <div class="row">
        <div><label>Fornitore</label><input id="ni_supplier"></div>
        <div><label>Lotto</label><div style="display:flex; gap:6px;"><input id="ni_lot"><button type="button" class="btn-ghost" style="flex:none; padding:6px 10px;" onclick="scanNewIngredientLot()" title="Scansiona il lotto">📷</button></div></div>
      </div>
      <label>Operatore</label><input id="ni_operator">
      <button class="btn-main" style="margin-top:10px;" onclick="addIngredient('${d.id}')">➕ Aggiungi ingrediente</button>
    </div>
  `;
}
async function saveDishDate(id, val){
  const d = DISHES.find(x=>x.id===id); if(!d) return;
  d.prodDate = val;
  await saveDish(d);
  render();
}
function renameDish(id){
  const d = DISHES.find(x=>x.id===id); if(!d) return;
  askForm("Rinomina piatto", [{id:"name", label:"Nome", value:d.name}], async v=>{
    if(!v.name) return;
    d.name = v.name;
    await saveDish(d);
    render();
  });
}
async function addIngredient(dishId){
  const name = document.getElementById("ni_name").value.trim();
  if(!name){ notify("Inserisci il nome dell'ingrediente."); return; }
  await saveIngredient({
    dishId, name,
    supplier: document.getElementById("ni_supplier").value.trim(),
    lot: document.getElementById("ni_lot").value.trim(),
    operator: document.getElementById("ni_operator").value.trim(),
    location: currentProfile,
  });
  render();
}
function scanNewIngredientLot(){
  openScanner(text=>{
    const lot = document.getElementById("ni_lot");
    if(lot) lot.value = text;
    const match = LOTS.find(l=>l.barcode===text);
    const sup = document.getElementById("ni_supplier");
    if(match && sup && !sup.value.trim()) sup.value = match.supplier||"";
  });
}
function changeLotManual(id){
  const i = INGREDIENTS.find(x=>x.id===id); if(!i) return;
  askForm("Modifica ingrediente", [
    {id:"name", label:"Nome ingrediente", value:i.name},
    {id:"supplier", label:"Fornitore", value:i.supplier},
    {id:"lot", label:"Lotto", value:i.lot},
    {id:"operator", label:"Operatore", value:i.operator},
  ], async v=>{
    if(v.name) i.name = v.name;
    i.lot = v.lot; i.supplier = v.supplier; i.operator = v.operator;
    await saveIngredient(i); render();
  });
}
function changeLotAuto(id){
  openScanner(async text=>{
    const i = INGREDIENTS.find(x=>x.id===id); if(!i) return;
    i.lot = text;
    const match = LOTS.find(l=>l.barcode===text);
    if(match){ i.supplier = match.supplier||i.supplier; }
    await saveIngredient(i); render();
  });
}

const APP_BUILD = (document.querySelector('meta[name="app-build"]')||{}).content || "";
async function checkForUpdate(){
  try{
    if(!APP_BUILD || !navigator.onLine) return;
    const u = new URL(location.href); u.searchParams.set("cb", Date.now());
    const res = await fetch(u.toString(), { cache:"no-store" });
    const rd = res.body && res.body.getReader ? res.body.getReader() : null;
    let txt = "";
    if(rd){
      const dec = new TextDecoder();
      while(txt.length < 6000){ const r = await rd.read(); if(r.done) break; txt += dec.decode(r.value, {stream:true}); if(/name="app-build" content="[^"]+"/.test(txt)) break; }
      try{ rd.cancel(); }catch(e){}
    }else{ txt = (await res.text()).slice(0, 6000); }
    const m = /name="app-build" content="([^"]+)"/.exec(txt);
    if(!m || m[1] === APP_BUILD) return;
    const key = "upd_tried_" + m[1];
    let tried = false; try{ tried = !!sessionStorage.getItem(key); sessionStorage.setItem(key, "1"); }catch(e){}
    if(tried) return;
    try{ if(window.caches){ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
    const n = new URL(location.href); n.searchParams.set("v", m[1].replace(/\D/g,""));
    location.replace(n.toString());
  }catch(e){}
}
setTimeout(checkForUpdate, 1500);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && (tab==="home" || tab==="login")) checkForUpdate(); });
function esc(s){ return (s===undefined||s===null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; editingLotId=null; editingFatturaId=null; fatturaPhoto=""; render(); });

render(); // mostra subito la schermata di caricamento

// Rete di sicurezza: se per qualsiasi motivo initDb() non finisce entro 8 secondi
// (connessione lenta, Firebase irraggiungibile, errore imprevisto), sblocca comunque
// l'app mostrando la schermata di accesso invece di restare bloccati sul caricamento.
let dbReady = false;
setTimeout(()=>{
  if(!dbReady && tab==="loading"){
    dbErr = true;
    if(!dbErrMsg) dbErrMsg = "il collegamento ha impiegato troppo tempo";
    tab = pendingTab;
    render();
  }
}, 15000);

initDb().catch(e=>{
  console.error(e);
  if(!dbReady){
    dbErr = true;
    dbErrMsg = String(e && e.message || e);
    tab = pendingTab;
    render();
  }
}).finally(()=>{ dbReady = true; });
</script>
